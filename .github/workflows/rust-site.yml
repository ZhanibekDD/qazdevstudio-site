name: Rust site

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - 'src/**'
      - 'templates/**'
      - 'rust-static/**'
      - 'data/software.json'
      - '.github/workflows/rust-site.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - 'src/**'
      - 'templates/**'
      - 'rust-static/**'
      - 'data/software.json'
      - '.github/workflows/rust-site.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: rust-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --all-targets --all-features --locked
      - name: Release build
        run: cargo build --release --locked

  image:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zhanibekdd/qazdevstudio-site:rust
            ghcr.io/zhanibekdd/qazdevstudio-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

