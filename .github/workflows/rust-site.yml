# Verifies the Rust application and publishes the production container from main.
name: Rust site

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - 'src/**'
      - 'templates/**'
      - 'rust-static/**'
      - 'node-static/**'
      - 'data/software.json'
      - 'data/editorial-programs.json'
      - '.github/workflows/rust-site.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - 'src/**'
      - 'templates/**'
      - 'rust-static/**'
      - 'node-static/**'
      - 'data/software.json'
      - 'data/editorial-programs.json'
      - '.github/workflows/rust-site.yml'

permissions:
  contents: write
  packages: write

concurrency:
  group: rust-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --all-targets --all-features --locked
      - name: Release build
        run: cargo build --release --locked

  image:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zhanibekdd/qazdevstudio-site:rust
            ghcr.io/zhanibekdd/qazdevstudio-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  plesk-static:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Render production site with Rust
        run: cargo run --release --locked --bin export-static -- target/plesk-site
      - name: Validate static production output
        run: |
          test -f target/plesk-site/index.html
          test -f target/plesk-site/programmy/index.html
          test -f target/plesk-site/api/programs.json
          test -f target/plesk-site/app.js
          test -f target/plesk-site/sitemap-index.xml
          test "$(find target/plesk-site/programmy -maxdepth 1 -name '*.html' | wc -l)" -ge 1001
          grep -q '<strong>QAZDEV</strong>' target/plesk-site/index.html
          grep -q 'data-whatsapp-form' target/plesk-site/index.html
          ! grep -q 'pagead2.googlesyndication.com' target/plesk-site/index.html
          grep -q 'SoftwareApplication' target/plesk-site/programmy/sharex.html
          grep -q 'content="index,follow' target/plesk-site/programmy/sharex.html
          grep -q 'content="noindex,follow"' target/plesk-site/programmy/audio-player.html
          grep -q 'простой аудиоплеер GNOME' target/plesk-site/programmy/audio-player.html
          grep -q '/programmy/sharex.html' target/plesk-site/sitemap-programs.xml
          ! grep -q '/programmy/audio-player.html' target/plesk-site/sitemap-programs.xml
          grep -q 'pub-8638191147118359' target/plesk-site/ads.txt
          node --check target/plesk-site/app.js
          export QAZDEV_DATA_DIR="$RUNNER_TEMP/qazdev-analytics"
          PORT=4181 node target/plesk-site/app.js &
          NODE_PID=$!
          trap 'kill "$NODE_PID" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:4181/health >/dev/null && break
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"event_type":"page_view","page_url":"/ci"}' http://127.0.0.1:4181/api/track.php)" = "204"
          test -s "$QAZDEV_DATA_DIR/analytics-$(date -u +%Y-%m).ndjson"
          kill "$NODE_PID"
          trap - EXIT
      - name: Publish Plesk-ready branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PUBLISH_DIR="$RUNNER_TEMP/qazdevstudio-plesk"
          cp -a target/plesk-site "$PUBLISH_DIR"
          git -C "$PUBLISH_DIR" init -b plesk-static
          git -C "$PUBLISH_DIR" config user.name 'github-actions[bot]'
          git -C "$PUBLISH_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$PUBLISH_DIR" add --all
          git -C "$PUBLISH_DIR" commit -m "Publish Rust static site ${GITHUB_SHA::7}"
          git -C "$PUBLISH_DIR" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$PUBLISH_DIR" push --force origin plesk-static
