name: Verify public software catalog

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-catalog.yml'
      - 'data/software.json'
      - 'data/winget-publication-selection.json'
      - 'data/flathub-publication-selection.json'
      - 'scripts/build-software-catalog.mjs'
      - 'scripts/verify-downloads.mjs'
      - 'scripts/promote-winget-candidates.mjs'
      - 'scripts/promote-flathub-candidates.mjs'
      - 'programmy/**'
      - 'sitemap-programmy.xml'

permissions:
  contents: read

concurrency:
  group: verify-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERIFY_CONCURRENCY: '10'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run catalog tests
        run: node --test tests/*.test.mjs

      - name: Rebuild catalog
        run: node scripts/build-software-catalog.mjs

      - name: Ensure generated pages are current
        run: git diff --exit-code -- programmy sitemap-programmy.xml

      - name: Verify all download rules structurally
        env:
          VERIFY_NETWORK: 'false'
        run: node scripts/verify-downloads.mjs
