name: Crawl software candidates

on:
  workflow_dispatch:
    inputs:
      pages:
        description: Search pages per query
        required: true
        default: '3'
        type: choice
        options: ['1', '3', '5', '10']
      min_stars:
        description: Minimum GitHub stars
        required: true
        default: '300'
        type: choice
        options: ['100', '300', '1000']
      max_repositories:
        description: Maximum repositories in this accumulated crawl
        required: true
        default: '3000'
        type: choice
        options: ['700', '3000', '5000', '10000']
  schedule:
    - cron: '17 1 * * 1'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/crawl-software.yml'
      - 'scripts/crawl-github-releases.mjs'
      - 'scripts/lib/catalog-crawler.mjs'
      - 'scripts/crawl-config.json'
      - 'tests/crawler.test.mjs'

permissions:
  contents: read

concurrency:
  group: software-crawler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVENT_NAME: ${{ github.event_name }}
      INPUT_PAGES: ${{ inputs.pages || '3' }}
      INPUT_MIN_STARS: ${{ inputs.min_stars || '300' }}
      INPUT_MAX_REPOSITORIES: ${{ inputs.max_repositories || '3000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore previous crawl checkpoint
        uses: actions/cache@v4
        with:
          path: |
            data/github-crawl.drafts.json
            data/github-crawl.state.json
          key: software-crawler-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            software-crawler-${{ github.ref_name }}-

      - name: Test crawler rules
        run: node --test tests/crawler.test.mjs

      - name: Build public catalog
        run: node scripts/build-software-catalog.mjs

      - name: Verify every public download button
        run: node scripts/verify-downloads.mjs

      - name: Collect candidates
        shell: bash
        run: |
          node scripts/crawl-github-releases.mjs \
            --all \
            --resume \
            --pages="$INPUT_PAGES" \
            --min-stars="$INPUT_MIN_STARS" \
            --max-repos="$INPUT_MAX_REPOSITORIES"

      - name: Build moderation queue
        run: node scripts/review-candidates.mjs --threshold=65 --limit=2000

      - name: Upload unpublished candidates
        uses: actions/upload-artifact@v4
        with:
          name: software-candidates-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            data/github-crawl.drafts.json
            data/crawl-summary.json
            data/review-queue.json
            data/review-queue.csv
