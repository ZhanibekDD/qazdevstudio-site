<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена | QazDev Studio</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050814;
      --text-1: #FFFFFF;
      --text-3: #94A3B8;
      --blue: #00D4FF;
      --purple: #7C3AED;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 480px; }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(80px, 20vw, 140px);
      font-weight: 600;
      line-height: 1;
      background: linear-gradient(135deg, #00D4FF 0%, #7C3AED 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 24px;
    }
    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--blue);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; }
    p { font-size: 15px; color: var(--text-3); line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: var(--blue);
      color: var(--bg);
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.3s;
    }
    .btn:hover { background: #33DDFF; transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,212,255,0.4); }
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
      z-index: 0;
    }
    .content { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="wrap content">
    <div class="label mono">// error 404</div>
    <div class="code" aria-hidden="true">404</div>
    <h1>Страница не найдена</h1>
    <p>Такой страницы не существует или она была перемещена. Вернитесь на главную — там всё есть.</p>
    <a href="/" class="btn">← Вернуться на главную</a>
  </div>
</body>
</html>
