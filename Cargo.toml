[package]
name = "qazdevstudio"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rust web core for qazdevstudio.kz"
license = "UNLICENSED"
publish = false

[dependencies]
askama = "0.16"
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7", features = ["compression-full", "fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

