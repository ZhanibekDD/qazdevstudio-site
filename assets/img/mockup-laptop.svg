<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" aria-label="Мокап сайта для бизнеса">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1C"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(0,212,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(124,58,237,0.08)"/>
    </linearGradient>
  </defs>

  <!-- Laptop body -->
  <rect x="40" y="20" width="400" height="250" rx="10" fill="url(#bgGrad)" stroke="#00D4FF" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Browser bar -->
  <rect x="40" y="20" width="400" height="36" rx="10" fill="#060A16"/>
  <rect x="40" y="46" width="400" height="10" fill="#060A16"/>
  <circle cx="64" cy="38" r="5" fill="#FF5F57"/>
  <circle cx="82" cy="38" r="5" fill="#FFBD2E"/>
  <circle cx="100" cy="38" r="5" fill="#28CA41"/>
  <rect x="120" y="30" width="200" height="16" rx="4" fill="rgba(0,0,0,0.4)"/>
  <text x="220" y="42" fill="#64748B" font-size="9" font-family="monospace" text-anchor="middle">business-taldykorgan.kz</text>

  <!-- Hero block -->
  <rect x="60" y="70" width="360" height="80" rx="6" fill="url(#heroGrad)" stroke="rgba(0,212,255,0.08)" stroke-width="1"/>
  <rect x="80" y="88" width="180" height="12" rx="3" fill="rgba(0,212,255,0.4)"/>
  <rect x="80" y="106" width="130" height="8" rx="2" fill="rgba(0,212,255,0.2)"/>
  <rect x="80" y="122" width="110" height="20" rx="5" fill="#25D366"/>
  <text x="135" y="136" fill="#000" font-size="9" font-weight="bold" font-family="sans-serif">Получить расчёт</text>

  <!-- Cards row -->
  <rect x="60" y="165" width="110" height="70" rx="6" fill="rgba(13,20,38,0.9)" stroke="rgba(0,212,255,0.12)" stroke-width="1"/>
  <text x="115" y="192" fill="#00D4FF" font-size="20" text-anchor="middle">⚖️</text>
  <rect x="74" y="202" width="82" height="7" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="74" y="215" width="60" height="5" rx="2" fill="rgba(255,255,255,0.08)"/>

  <rect x="185" y="165" width="110" height="70" rx="6" fill="rgba(13,20,38,0.9)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <text x="240" y="192" fill="#7C3AED" font-size="20" text-anchor="middle">🤖</text>
  <rect x="199" y="202" width="82" height="7" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="199" y="215" width="60" height="5" rx="2" fill="rgba(255,255,255,0.08)"/>

  <rect x="310" y="165" width="110" height="70" rx="6" fill="rgba(13,20,38,0.9)" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
  <text x="365" y="192" fill="#10B981" font-size="20" text-anchor="middle">📊</text>
  <rect x="324" y="202" width="82" height="7" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="324" y="215" width="60" height="5" rx="2" fill="rgba(255,255,255,0.08)"/>

  <!-- Laptop base -->
  <ellipse cx="240" cy="285" rx="210" ry="8" fill="rgba(0,212,255,0.05)" stroke="rgba(0,212,255,0.1)" stroke-width="1"/>
  <rect x="170" y="270" width="140" height="12" rx="3" fill="#060A16" stroke="rgba(0,212,255,0.1)" stroke-width="1"/>

  <!-- Glow -->
  <ellipse cx="240" cy="150" rx="160" ry="100" fill="rgba(0,212,255,0.03)"/>
</svg>
