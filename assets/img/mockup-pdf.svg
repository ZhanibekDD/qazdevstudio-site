<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" aria-label="Мокап автоматизации документов">
  <defs>
    <linearGradient id="docBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1C"/>
      <stop offset="100%" stop-color="#0A1224"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="320" height="400" rx="16" fill="url(#docBg)" stroke="rgba(37,99,235,0.25)" stroke-width="1.5"/>

  <!-- Document icon area -->
  <rect x="30" y="30" width="130" height="170" rx="8" fill="rgba(37,99,235,0.08)" stroke="rgba(37,99,235,0.25)" stroke-width="1.5"/>
  <!-- Page fold -->
  <path d="M130 30 L160 60 L160 200 L30 200 L30 30 Z" fill="rgba(37,99,235,0.06)" stroke="rgba(37,99,235,0.2)" stroke-width="1.5"/>
  <path d="M130 30 L160 60 L130 60 Z" fill="rgba(37,99,235,0.2)" stroke="rgba(37,99,235,0.3)" stroke-width="1"/>
  <!-- Document lines -->
  <rect x="46" y="78" width="96" height="7" rx="3" fill="rgba(37,99,235,0.4)"/>
  <rect x="46" y="96" width="80" height="5" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="46" y="112" width="88" height="5" rx="2" fill="rgba(255,255,255,0.1)"/>
  <!-- Fields -->
  <rect x="46" y="130" width="50" height="5" rx="2" fill="rgba(100,116,139,0.4)"/>
  <rect x="46" y="142" width="88" height="7" rx="2" fill="rgba(0,212,255,0.25)"/>
  <rect x="46" y="158" width="50" height="5" rx="2" fill="rgba(100,116,139,0.4)"/>
  <rect x="46" y="170" width="72" height="7" rx="2" fill="rgba(0,212,255,0.25)"/>
  <!-- PDF label -->
  <text x="46" y="60" fill="#2563EB" font-size="11" font-weight="bold" font-family="monospace">PDF</text>

  <!-- Check success badge -->
  <circle cx="148" cy="188" r="18" fill="#050814" stroke="#10B981" stroke-width="2"/>
  <path d="M139 188 L145 194 L157 182" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Info block right -->
  <rect x="180" y="30" width="120" height="170" rx="8" fill="rgba(5,8,20,0.6)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="240" y="56" fill="#64748B" font-size="9" text-anchor="middle" font-family="monospace">// Документ</text>
  <rect x="196" y="66" width="88" height="10" rx="3" fill="rgba(255,255,255,0.12)"/>
  <text x="240" y="100" fill="#E5E7EB" font-size="10" text-anchor="middle" font-family="sans-serif">Договор</text>
  <text x="240" y="116" fill="#E5E7EB" font-size="10" text-anchor="middle" font-family="sans-serif">оказания услуг</text>
  <text x="240" y="138" fill="#64748B" font-size="8" text-anchor="middle" font-family="monospace">№ 2026-047</text>
  <rect x="196" y="150" width="88" height="1" fill="rgba(255,255,255,0.06)"/>
  <text x="196" y="168" fill="#64748B" font-size="8" font-family="monospace">Статус:</text>
  <text x="196" y="182" fill="#10B981" font-size="9" font-weight="bold" font-family="monospace">✓ Сформирован</text>

  <!-- Process steps -->
  <text x="30" y="228" fill="#64748B" font-size="10" font-family="monospace">// Как это работает</text>

  <!-- Step 1 -->
  <circle cx="48" cy="256" r="14" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.3)" stroke-width="1.5"/>
  <text x="48" y="261" fill="#00D4FF" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">1</text>
  <text x="72" y="254" fill="#E5E7EB" font-size="11" font-family="sans-serif">Клиент заполняет форму</text>
  <text x="72" y="267" fill="#64748B" font-size="9" font-family="sans-serif">на сайте или в боте</text>

  <!-- Step 2 -->
  <circle cx="48" cy="300" r="14" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5"/>
  <text x="48" y="305" fill="#7C3AED" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">2</text>
  <text x="72" y="298" fill="#E5E7EB" font-size="11" font-family="sans-serif">Данные подставляются</text>
  <text x="72" y="311" fill="#64748B" font-size="9" font-family="sans-serif">в шаблон автоматически</text>

  <!-- Step 3 -->
  <circle cx="48" cy="344" r="14" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
  <text x="48" y="349" fill="#10B981" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">3</text>
  <text x="72" y="342" fill="#E5E7EB" font-size="11" font-family="sans-serif">PDF-документ готов</text>
  <text x="72" y="355" fill="#10B981" font-size="9" font-family="sans-serif">за 30 секунд</text>

  <!-- Connector lines -->
  <line x1="48" y1="270" x2="48" y2="286" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="48" y1="314" x2="48" y2="330" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Bottom label -->
  <text x="160" y="388" fill="#64748B" font-size="9" text-anchor="middle" font-family="monospace">Экономия: ~2 часа на каждый документ</text>
</svg>
