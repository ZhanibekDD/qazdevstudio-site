<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 400" width="280" height="400" aria-label="Мокап Telegram-бота для заявок">
  <defs>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080D1C"/>
      <stop offset="100%" stop-color="#060A14"/>
    </linearGradient>
  </defs>

  <!-- Phone frame -->
  <rect x="30" y="10" width="220" height="380" rx="28" fill="url(#phoneBg)" stroke="#00D4FF" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Notch -->
  <rect x="100" y="18" width="80" height="12" rx="6" fill="#060A14"/>

  <!-- Telegram header -->
  <rect x="30" y="40" width="220" height="50" fill="rgba(0,0,0,0.3)"/>
  <circle cx="65" cy="65" r="16" fill="rgba(0,212,255,0.15)" stroke="rgba(0,212,255,0.3)" stroke-width="1.5"/>
  <text x="65" y="70" fill="#00D4FF" font-size="16" text-anchor="middle">🤖</text>
  <rect x="90" y="57" width="80" height="9" rx="2" fill="rgba(255,255,255,0.7)"/>
  <rect x="90" y="71" width="50" height="6" rx="2" fill="rgba(16,185,129,0.6)"/>
  <text x="245" y="61" fill="#94A3B8" font-size="10" text-anchor="end">⋮</text>

  <!-- Chat messages -->
  <!-- Bot msg 1 -->
  <rect x="42" y="106" width="150" height="32" rx="10" rx="10" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>
  <text x="55" y="121" fill="#E5E7EB" font-size="10" font-family="sans-serif">Добрый день! Как вас зовут?</text>
  <text x="178" y="131" fill="#64748B" font-size="8" font-family="monospace">09:42</text>

  <!-- User msg 1 -->
  <rect x="138" y="148" width="100" height="28" rx="10" fill="rgba(0,90,40,0.5)" stroke="rgba(0,180,80,0.2)" stroke-width="1"/>
  <text x="188" y="167" fill="#E5E7EB" font-size="10" font-family="sans-serif" text-anchor="middle">Алия</text>

  <!-- Bot msg 2 -->
  <rect x="42" y="188" width="170" height="32" rx="10" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>
  <text x="55" y="201" fill="#E5E7EB" font-size="10" font-family="sans-serif">Алия, укажите номер</text>
  <text x="55" y="214" fill="#E5E7EB" font-size="10" font-family="sans-serif">телефона</text>

  <!-- User msg 2 -->
  <rect x="108" y="232" width="130" height="28" rx="10" fill="rgba(0,90,40,0.5)" stroke="rgba(0,180,80,0.2)" stroke-width="1"/>
  <text x="173" y="251" fill="#E5E7EB" font-size="10" font-family="sans-serif" text-anchor="middle">+7 777 123 45 67</text>

  <!-- Bot msg 3 success -->
  <rect x="42" y="272" width="155" height="32" rx="10" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="55" y="285" fill="#10B981" font-size="10" font-family="sans-serif">✓ Заявка принята!</text>
  <text x="55" y="298" fill="#94A3B8" font-size="9" font-family="sans-serif">Скоро с вами свяжутся</text>

  <!-- Bot notification arrow -->
  <rect x="42" y="316" width="196" height="40" rx="8" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.12)" stroke-width="1"/>
  <text x="140" y="332" fill="#64748B" font-size="9" text-anchor="middle" font-family="monospace">→ Уведомление отправлено</text>
  <text x="140" y="346" fill="#00D4FF" font-size="9" text-anchor="middle" font-family="monospace">владельцу бизнеса</text>

  <!-- Bottom input bar -->
  <rect x="30" y="366" width="220" height="24" fill="rgba(5,8,20,0.9)"/>
  <rect x="42" y="370" width="165" height="16" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(0,212,255,0.1)" stroke-width="1"/>
  <circle cx="226" cy="378" r="8" fill="rgba(0,212,255,0.2)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
</svg>
