<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" aria-label="Мокап CRM-системы для заявок">
  <defs>
    <linearGradient id="crmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1C"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="300" rx="16" fill="url(#crmBg)" stroke="rgba(16,185,129,0.2)" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="480" height="48" rx="0" fill="rgba(5,8,20,0.9)"/>
  <rect x="0" y="0" width="480" height="16" rx="0" fill="rgba(5,8,20,0.9)"/>
  <rect x="0" y="32" width="480" height="16" rx="0" fill="rgba(5,8,20,0.9)"/>
  <rect x="0" y="0" width="480" height="48" rx="16" fill="rgba(5,8,20,0.9)"/>
  <rect x="0" y="32" width="480" height="16" fill="rgba(5,8,20,0.9)"/>

  <text x="24" y="30" fill="#10B981" font-size="13" font-weight="bold" font-family="monospace">CRM Pipeline</text>
  <rect x="380" y="16" width="80" height="18" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="420" y="29" fill="#10B981" font-size="10" text-anchor="middle" font-family="monospace">● LIVE</text>

  <!-- Column headers -->
  <text x="55" y="72" fill="#64748B" font-size="10" font-family="monospace" text-anchor="middle">НОВЫЕ</text>
  <text x="175" y="72" fill="#00D4FF" font-size="10" font-family="monospace" text-anchor="middle">В РАБОТЕ</text>
  <text x="295" y="72" fill="#F5C542" font-size="10" font-family="monospace" text-anchor="middle">ОПЛАТА</text>
  <text x="415" y="72" fill="#10B981" font-size="10" font-family="monospace" text-anchor="middle">ЗАВЕРШЕНО</text>

  <!-- Column separators -->
  <line x1="120" y1="54" x2="120" y2="290" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="240" y1="54" x2="240" y2="290" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="360" y1="54" x2="360" y2="290" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Новые -->
  <rect x="10" y="80" width="100" height="52" rx="8" fill="rgba(13,20,38,0.8)" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>
  <text x="60" y="101" fill="#E5E7EB" font-size="10" text-anchor="middle" font-family="sans-serif">Клиент А</text>
  <text x="60" y="116" fill="#64748B" font-size="9" text-anchor="middle" font-family="monospace">Сайт · 150K ₸</text>
  <circle cx="88" cy="97" r="4" fill="rgba(0,212,255,0.4)"/>

  <rect x="10" y="140" width="100" height="52" rx="8" fill="rgba(13,20,38,0.8)" stroke="rgba(0,212,255,0.12)" stroke-width="1"/>
  <text x="60" y="161" fill="#E5E7EB" font-size="10" text-anchor="middle" font-family="sans-serif">Клиент Б</text>
  <text x="60" y="176" fill="#64748B" font-size="9" text-anchor="middle" font-family="monospace">Бот · 70K ₸</text>

  <rect x="10" y="200" width="100" height="52" rx="8" fill="rgba(13,20,38,0.8)" stroke="rgba(0,212,255,0.12)" stroke-width="1"/>
  <text x="60" y="221" fill="#E5E7EB" font-size="10" text-anchor="middle" font-family="sans-serif">Клиент В</text>
  <text x="60" y="236" fill="#64748B" font-size="9" text-anchor="middle" font-family="monospace">CRM · 200K ₸</text>

  <!-- В работе -->
  <rect x="130" y="80" width="100" height="52" rx="8" fill="rgba(0,90,160,0.15)" stroke="rgba(0,212,255,0.3)" stroke-width="1.5"/>
  <text x="180" y="101" fill="#00D4FF" font-size="10" text-anchor="middle" font-family="sans-serif">Клиент Г</text>
  <text x="180" y="116" fill="#64748B" font-size="9" text-anchor="middle" font-family="monospace">Лендинг · 80K ₸</text>
  <circle cx="218" cy="97" r="4" fill="#00D4FF"/>

  <rect x="130" y="140" width="100" height="52" rx="8" fill="rgba(0,90,160,0.1)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <text x="180" y="161" fill="#E5E7EB" font-size="10" text-anchor="middle" font-family="sans-serif">Клиент Д</text>
  <text x="180" y="176" fill="#64748B" font-size="9" text-anchor="middle" font-family="monospace">Сайт+бот · 250K ₸</text>

  <!-- Оплата -->
  <rect x="250" y="80" width="100" height="52" rx="8" fill="rgba(245,197,66,0.08)" stroke="rgba(245,197,66,0.3)" stroke-width="1.5"/>
  <text x="300" y="101" fill="#F5C542" font-size="10" text-anchor="middle" font-family="sans-serif">Клиент Е</text>
  <text x="300" y="116" fill="#64748B" font-size="9" text-anchor="middle" font-family="monospace">Автоматизация</text>
  <circle cx="338" cy="97" r="4" fill="#F5C542"/>

  <!-- Завершено -->
  <rect x="370" y="80" width="100" height="52" rx="8" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
  <text x="420" y="101" fill="#10B981" font-size="10" text-anchor="middle" font-family="sans-serif">Клиент Ж</text>
  <text x="420" y="116" fill="#10B981" font-size="9" text-anchor="middle" font-family="monospace">✓ Готово</text>
  <circle cx="458" cy="97" r="4" fill="#10B981"/>

  <rect x="370" y="140" width="100" height="52" rx="8" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="420" y="161" fill="#10B981" font-size="10" text-anchor="middle" font-family="sans-serif">Клиент З</text>
  <text x="420" y="176" fill="#10B981" font-size="9" text-anchor="middle" font-family="monospace">✓ Оплачено</text>

  <!-- Stats bar -->
  <rect x="10" y="262" width="460" height="28" rx="8" fill="rgba(5,8,20,0.7)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="30" y="280" fill="#64748B" font-size="9" font-family="monospace">Итого заявок: </text>
  <text x="105" y="280" fill="#00D4FF" font-size="9" font-weight="bold" font-family="monospace">8</text>
  <text x="140" y="280" fill="#64748B" font-size="9" font-family="monospace">В работе: </text>
  <text x="197" y="280" fill="#F5C542" font-size="9" font-weight="bold" font-family="monospace">2</text>
  <text x="230" y="280" fill="#64748B" font-size="9" font-family="monospace">Завершено: </text>
  <text x="293" y="280" fill="#10B981" font-size="9" font-weight="bold" font-family="monospace">2</text>
  <text x="360" y="280" fill="#64748B" font-size="9" font-family="monospace">Выручка:</text>
  <text x="405" y="280" fill="#10B981" font-size="9" font-weight="bold" font-family="monospace">850K ₸</text>
</svg>
